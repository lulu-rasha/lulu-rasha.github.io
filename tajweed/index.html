<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تعلّمي التجويد</title>
<meta name="theme-color" content="#0f5a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f5a4a'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23f3d58a'%3E%D8%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#1d2a26;--muted:#6b7a74;--line:#e5dfcf;--pri:#0f5a4a;--pri2:#e6f1ec;--gold:#b8873a;--ok:#1f8a5b;--bad:#c0392b;
--izhar:#2f7d32;--idgham:#7b4fb8;--iqlab:#1e6fd9;--ikhfa:#d94f8a;--ghunna:#e0761f;--qalqala:#1aa3b8;--tafkhim:#1d4ed8;--madd2:#c28b00;--madd5:#e0761f;--madd6:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101715;--card:#18221f;--ink:#eef3f0;--muted:#9fb0a9;--line:#2a3833;--pri:#3fb592;--pri2:#1d3029}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.75;font-size:17px;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:6px 12px;font:inherit;font-size:15px}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.hero{text-align:center}.hero b{color:var(--gold)}
.bar{height:10px;background:var(--pri2);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.lesson{display:flex;align-items:center;gap:12px;cursor:pointer}
.lesson .ic{font-size:26px;width:46px;height:46px;display:grid;place-items:center;background:var(--pri2);border-radius:14px;flex:none}
.lesson .t{flex:1}.lesson .t b{display:block}.lesson .t small{color:var(--muted)}
.st{font-size:13px;padding:3px 10px;border-radius:20px;background:var(--pri2);color:var(--pri);white-space:nowrap}
h2{font-size:22px;margin:4px 0 10px}h3{font-size:18px;margin:16px 0 6px;color:var(--pri)}
ul{padding-inline-start:20px;margin:6px 0}li{margin:4px 0}
.rule{border-inline-start:5px solid var(--c,var(--pri));background:var(--pri2);border-radius:12px;padding:10px 12px;margin:12px 0}
.rule .rt{font-weight:700;color:var(--c,var(--pri))}
.q{font-family:'Amiri Quran','Amiri',serif;font-size:26px;line-height:2.1}
.exs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.exs>span{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 12px}
.hl{color:var(--c);font-weight:700}
.tip{background:#fff6e0;border:1px solid #f0dca8;color:#6b4f12;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:15.5px}
@media (prefers-color-scheme:dark){.tip{background:#2b2615;border-color:#4a3f1d;color:#f0dca8}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:600;background:var(--pri);color:#fff;cursor:pointer;width:100%}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.row{display:flex;gap:10px}.row .btn{flex:1}
.opt{display:block;width:100%;text-align:start;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#e6f6ee;color:#145c3c}.opt.no{border-color:var(--bad);background:#fbe9e7;color:#8a2318}
.fb{border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15.5px}
.fb.ok{background:#e6f6ee;color:#145c3c}.fb.no{background:#fbe9e7;color:#8a2318}
input[type=text],textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink)}
textarea{min-height:140px;resize:vertical}
.small{font-size:14px;color:var(--muted)}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:5px;vertical-align:-1px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;border:0;border-radius:12px;padding:10px;font:inherit;font-size:15px;background:var(--pri2);color:var(--pri)}.tabs button.on{background:var(--pri);color:#fff}
</style>
</head>
<body>
<header><button id="back" hidden>→</button><h1 id="ttl">تعلّمي التجويد</h1></header>
<main id="app"></main>
<script src="data.js"></script>
<script>
const app=document.getElementById('app'),ttl=document.getElementById('ttl'),back=document.getElementById('back');
const COL={izhar:'--izhar',idgham:'--idgham',iqlab:'--iqlab',ikhfa:'--ikhfa',ghunna:'--ghunna',qalqala:'--qalqala',tafkhim:'--tafkhim',madd2:'--madd2',madd5:'--madd5',madd6:'--madd6'};
const store={get(k,d){try{return JSON.parse(localStorage.getItem('tj_'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('tj_'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function qtext(s,kind){const c=COL[kind]||'--pri';return esc(s).replace(/\[([^\]]+)\]/g,`<span class="hl" style="--c:var(${c})">$1</span>`)}
const norm=s=>String(s).replace(/[ً-ٰٟۡ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^ء-ي0-9 ]/g,'').replace(/\s+/g,' ').trim();
function score(id){return store.get('s_'+id,null)}
function home(){
  back.hidden=true;ttl.textContent='تعلّمي التجويد';location.hash='';
  const done=LESSONS.filter(l=>(score(l.id)||0)>=80).length;
  app.innerHTML=`<div class="card hero"><div style="font-size:15px;color:var(--muted)">برواية حفص عن عاصم</div>
   <div style="font-size:20px;font-weight:700;margin:4px 0">خلّصتي <b>${done}</b> من ${LESSONS.length} دروس</div>
   <div class="bar"><i style="width:${done/LESSONS.length*100}%"></i></div>
   <p class="small" style="margin:10px 0 0">اقري الدرس، اكتبي بدفترك، وبعدين حلّي التمارين. الدرس بيخلص إذا جبتي 80٪ وفوق.</p></div>
   ${LESSONS.map((l,i)=>{const s=score(l.id);return `<div class="card lesson" data-i="${i}"><div class="ic">${l.icon}</div><div class="t"><b>${i+1}. ${l.title}</b><small>${l.quiz.length} تمارين</small></div><span class="st">${s==null?'جديد':s>=80?'✓ '+s+'٪':s+'٪'}</span></div>`}).join('')}
   <div class="card"><button class="btn" id="final">🎓 الاختبار الشامل (15 سؤال من كل الدروس)</button></div>
   <div class="card"><b>دليل الألوان</b><div class="legend" style="margin-top:8px">${[['izhar','إظهار'],['idgham','إدغام'],['iqlab','إقلاب'],['ikhfa','إخفاء'],['ghunna','غنّة'],['qalqala','قلقلة'],['tafkhim','تفخيم'],['madd2','مد حركتين'],['madd5','مد 4-5'],['madd6','مد 6']].map(([k,n])=>`<span><i style="background:var(${COL[k]})"></i>${n}</span>`).join('')}</div>
   <p class="small" style="margin:10px 0 0">هالتطبيق بيعلّمك الأحكام، بس النطق الصح بيتعلّم بالسمع. اسمعي لشيخ متقن، وسمّعي لمعلّمة كل فترة.</p></div>`;
  app.querySelectorAll('.lesson').forEach(e=>e.onclick=()=>lesson(+e.dataset.i,'learn'));
  document.getElementById('final').onclick=()=>{const all=LESSONS.flatMap(l=>l.quiz.map(q=>({...q,_l:l.title})));quiz(shuffle(all).slice(0,15),'final','🎓 الاختبار الشامل')};
  scrollTo(0,0);
}
function lesson(i,tab){
  const l=LESSONS[i];back.hidden=false;ttl.textContent=l.title;location.hash='l'+i;
  const tabs=`<div class="tabs"><button data-t="learn" class="${tab==='learn'?'on':''}">📖 الدرس</button><button data-t="note" class="${tab==='note'?'on':''}">✍️ دفتري</button><button data-t="quiz" class="${tab==='quiz'?'on':''}">📝 تمارين</button></div>`;
  if(tab==='learn'){
    app.innerHTML=tabs+`<div class="card"><h2>${l.icon} ${l.title}</h2>${l.body.map(renderBlock).join('')}</div>
    <div class="row"><button class="btn ghost" id="toNote">✍️ اكتبي بدفترك</button><button class="btn" id="toQuiz">📝 ابلشي التمارين</button></div>`;
    document.getElementById('toNote').onclick=()=>lesson(i,'note');document.getElementById('toQuiz').onclick=()=>lesson(i,'quiz');
  } else if(tab==='note'){
    app.innerHTML=tabs+`<div class="card"><h2>✍️ دفتري: ${l.title}</h2>
    <p class="small">اكتبي الحكم بكلماتك: شو هوّي، حروفه، مثال من القرآن. الكتابة بتثبّت المعلومة. كلشي بينحفظ عتلفونك.</p>
    <textarea id="nt" placeholder="مثلاً: الإظهار الحلقي: حروفه ء هـ ع ح غ خ، منلفظ النون واضحة. مثال: مِنْ خَيْرٍ">${esc(store.get('n_'+l.id,''))}</textarea>
    <p class="small" id="sv"> </p></div><button class="btn" id="toQuiz">📝 ابلشي التمارين</button>`;
    const t=document.getElementById('nt'),sv=document.getElementById('sv');
    t.oninput=()=>{store.set('n_'+l.id,t.value);sv.textContent='✓ انحفظ'};
    document.getElementById('toQuiz').onclick=()=>lesson(i,'quiz');
  } else { quiz(l.quiz,l.id,l.title,tabs,i) }
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>lesson(i,b.dataset.t));
  scrollTo(0,0);
}
function renderBlock(b){
  const [t,...a]=b;
  if(t==='p')return `<p>${a[0]}</p>`;
  if(t==='h')return `<h3>${a[0]}</h3>`;
  if(t==='li')return `<ul>${a[0].map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(t==='tip')return `<div class="tip">💡 ${a[0]}</div>`;
  if(t==='ex')return `<div class="exs q">${a[0].map(x=>`<span>${qtext(x,a[1])}</span>`).join('')}</div>`;
  if(t==='rule'){const [name,desc,exs,kind]=a;const c=COL[kind]||'--pri';
    return `<div class="rule" style="--c:var(${c})"><div class="rt">${name}</div><div>${desc}</div>${exs.length?`<div class="exs q">${exs.map(x=>`<span>${qtext(x,kind)}</span>`).join('')}</div>`:''}</div>`}
  return '';
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quiz(qs,id,title,tabs='',li=null){
  back.hidden=false;ttl.textContent=title;let k=0,right=0;
  const isQ=s=>/[ً-ْ]/.test(s);
  function show(){
    if(k>=qs.length){const pct=Math.round(right/qs.length*100);const prev=score(id);if(prev==null||pct>prev)store.set('s_'+id,pct);
      app.innerHTML=tabs+`<div class="card hero"><div style="font-size:48px">${pct>=80?'🌟':'💪'}</div><h2>${right} من ${qs.length} (${pct}٪)</h2>
      <p>${pct>=80?'برافو عليكِ! خلّصتي هالدرس 🤍':'قريبة! ارجعي اقري الدرس مرّة تانية وجرّبي.'}</p></div>
      <div class="row"><button class="btn ghost" id="again">🔁 عيدي</button><button class="btn" id="home">🏠 الدروس</button></div>`;
      document.getElementById('again').onclick=()=>quiz(id==='final'?shuffle(LESSONS.flatMap(l=>l.quiz)).slice(0,15):qs,id,title,tabs,li);
      document.getElementById('home').onclick=home;bindTabs();return}
    const q=qs[k];
    let html=tabs+`<div class="card"><div class="qhead"><span>سؤال ${k+1} من ${qs.length}</span><span>${right} ✓</span></div>
      <div class="bar"><i style="width:${k/qs.length*100}%"></i></div>
      <div style="margin:14px 0 6px;${isQ(q.q)?'':'font-weight:600'}" class="${isQ(q.q)?'q':''}">${esc(q.q)}</div>${isQ(q.q)?'<div class="small">شو الحكم؟</div>':''}`;
    if(q.t==='w'){html+=`<input type="text" id="w" placeholder="اكتبي جوابك هون" autocomplete="off"><div style="height:10px"></div><button class="btn" id="chk">تأكّدي</button><div id="fb"></div></div>`}
    else{const order=shuffle(q.a.map((x,j)=>j));html+=order.map(j=>`<button class="opt" data-j="${j}">${esc(q.a[j])}</button>`).join('')+`<div id="fb"></div></div>`}
    app.innerHTML=html;bindTabs();
    const fb=document.getElementById('fb');
    const next=(ok,msg)=>{if(ok)right++;fb.innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✓ صح! ':'✗ مش هيك. '}${esc(msg)}</div><div style="height:10px"></div><button class="btn" id="nx">${k+1<qs.length?'السؤال الجاي ←':'شوفي النتيجة'}</button>`;
      document.getElementById('nx').onclick=()=>{k++;show();scrollTo(0,0)}};
    if(q.t==='w'){const w=document.getElementById('w'),chk=document.getElementById('chk');
      const go=()=>{if(!w.value.trim())return;chk.disabled=true;w.disabled=true;
        const v=norm(w.value),vs=v.replace(/ /g,'');
        const ok=q.ans.some(a=>{const n=norm(a),ns=n.replace(/ /g,'');return q.letters?[...ns].every(c=>vs.includes(c)):(v===n||vs===ns||vs.includes(ns))});
        next(ok,ok?q.e:'الجواب: '+q.e)};
      chk.onclick=go;w.onkeydown=e=>{if(e.key==='Enter')go()};w.focus()}
    else app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===q.c;
      app.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.j===q.c)o.classList.add('ok')});if(!ok)b.classList.add('no');next(ok,q.e)});
  }
  function bindTabs(){if(li!=null)app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>lesson(li,b.dataset.t))}
  show();scrollTo(0,0);
}
back.onclick=home;
window.onpopstate=()=>{if(!location.hash)home()};
const m=location.hash.match(/^#l(\d+)$/);m&&LESSONS[+m[1]]?lesson(+m[1],'learn'):home();
</script>
</body>
</html>
