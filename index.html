<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متجر رشا</title>
<meta name="description" content="إكسسوارات ستانلس ومنتجات عناية أصلية، توصيل لكل لبنان والطلب عالواتساب">
<meta property="og:title" content="متجر رشا">
<meta property="og:description" content="إكسسوارات ستانلس ومنتجات عناية أصلية، توصيل لكل لبنان">
<meta property="og:image" content="images/necklace-1.jpg">
<meta name="theme-color" content="#F7F2F4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23A8596D'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='serif'%3ER%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root"><div class="wrap"><header class="top"><h1 class="mark">رشا</h1><div class="mark-latin">RASHA</div><p class="tagline">عم تتحمّل المنتجات…</p></header></div></div>
<script>
(function(){
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS=[["all","الكل"],["acc","إكسسوارات"],["care","عناية"]];
let S={settings:{},products:[]}, cat="all";
const WA='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3Z"/></svg>';
const phone=()=>String(S.settings.phone||"").replace(/\D/g,"");
const money=p=>{const n=Number(p)||0;return (n%1?n.toFixed(2):String(n))+"$"};
function waLink(p){const n=phone();if(!n)return "";
  const msg=`مرحبا رشا 🌸\nبدي اطلب:\n• ${p.name}\n• السعر: ${money(p.price)}\n• رقم المنتج: ${p.code||p.id}\n\nممكن تفاصيل التوصيل؟`;
  return "https://wa.me/"+n+"?text="+encodeURIComponent(msg)}
function render(){
  const list=S.products.filter(p=>cat==="all"||p.cat===cat), n=phone();
  document.title=(S.settings.name||"رشا")==="رشا"?"متجر رشا":S.settings.name;
  $("#root").innerHTML=`<div class="wrap">
    <header class="top"><h1 class="mark">${esc(S.settings.name||"رشا")}</h1><div class="mark-latin">RASHA</div>
      <p class="tagline">${esc(S.settings.tagline||"")}</p>
      <div class="facts"><span>توصيل لكل لبنان</span><span>الدفع عند الاستلام</span><span>${n?`واتساب <span class="num">+${esc(n)}</span>`:"الطلب عالواتساب"}</span></div></header>
    <nav class="chips" aria-label="الأقسام">${CATS.map(([k,l])=>`<button class="chip" data-cat="${k}" aria-pressed="${cat===k}">${l}</button>`).join("")}</nav>
    <section class="grid">${list.length?list.map(card).join(""):`<div class="empty">قريباً منتجات جديدة بهالقسم 🌸</div>`}</section></div>
    <footer><div class="wrap"><div>للطلب والاستفسار ${n?`عالواتساب: <span class="num">+${esc(n)}</span>`:"عالواتساب"}</div><div>كبسي على أي منتج وبتوصلك رسالة الطلب جاهزة</div></div></footer>`;
}
function card(p){const img=(p.images||[])[0];
  return `<article class="card" style="cursor:pointer" data-open="${esc(p.id)}" tabindex="0" role="button" aria-label="${esc(p.name)}">
    <div class="ph">${img?`<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">`:""}
    ${p.soldOut?`<span class="badge out">نفدت الكمية</span>`:p.tag?`<span class="badge">${esc(p.tag)}</span>`:""}
    ${(p.images||[]).length>1?`<span class="count">${p.images.length} صور</span>`:""}</div>
    <h3 class="c-name">${esc(p.name)}</h3>
    <div class="c-row"><span class="price">${money(p.price)}</span>${p.soldOut?"":`<span class="mini-wa">${WA}اطلبي</span>`}</div></article>`}
function openProduct(id){
  const p=S.products.find(x=>x.id===id); if(!p) return;
  const imgs=p.images||[], link=waLink(p);
  const sh=document.createElement("div"); sh.className="sheet"; sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true");
  sh.innerHTML=`<div class="panel"><div class="gal"><button class="close" aria-label="سكّري">×</button>
    <div class="track">${imgs.map((u,i)=>`<img src="${esc(u)}" alt="${esc(p.name)} ${i+1}">`).join("")}</div>
    ${imgs.length>1?`<div class="dots">${imgs.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div><div class="thumbs">${imgs.map((u,i)=>`<button data-i="${i}" class="${i?"":"on"}" aria-label="صورة ${i+1}"><img src="${esc(u)}" alt=""></button>`).join("")}</div>`:""}</div>
    <div class="info"><h2>${esc(p.name)}</h2><div class="price">${money(p.price)}</div>
    ${p.desc?`<p class="desc">${esc(p.desc)}</p>`:""}<div class="code">رقم المنتج: ${esc(p.code||p.id)}</div>
    ${p.soldOut?`<div class="btn btn-ghost" aria-disabled="true">نفدت الكمية</div>`:link?`<a class="btn btn-wa" href="${link}" target="_blank" rel="noopener">${WA} اطلبي عالواتساب</a><div class="note">بتنفتحلك محادثة واتساب فيها رسالة الطلب جاهزة، بس ابعتيها.</div>`:`<div class="btn btn-ghost" aria-disabled="true">${WA} رقم الواتساب لسا ما انضاف</div>`}
    </div></div>`;
  document.body.appendChild(sh); document.body.style.overflow="hidden";
  const track=$(".track",sh), dots=[...sh.querySelectorAll(".dots i")], th=[...sh.querySelectorAll(".thumbs button")];
  track.addEventListener("scroll",()=>{const i=Math.round(track.scrollLeft/track.clientWidth);dots.forEach((d,k)=>d.classList.toggle("on",k===i));th.forEach((d,k)=>d.classList.toggle("on",k===i))},{passive:true});
  th.forEach(b=>b.onclick=()=>track.scrollTo({left:track.clientWidth*+b.dataset.i,behavior:"smooth"}));
  const close=()=>{sh.remove();document.body.style.overflow="";document.removeEventListener("keydown",k);history.replaceState(null,"",location.pathname)};
  const k=e=>{if(e.key==="Escape")close()};
  document.addEventListener("keydown",k); $(".close",sh).onclick=close; sh.addEventListener("click",e=>{if(e.target===sh)close()});
  history.replaceState(null,"","#"+p.id);
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-cat],[data-open]");if(!t)return;
  if(t.dataset.cat){cat=t.dataset.cat;render()}else openProduct(t.dataset.open)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.open)openProduct(e.target.dataset.open)});
fetch("products.json?v="+Date.now()).then(r=>r.json()).then(d=>{S=d;S.settings=S.settings||{};S.products=S.products||[];render();if(location.hash.length>1)openProduct(location.hash.slice(1))})
 .catch(()=>{$(".tagline").textContent="ما قدرنا نحمّل المنتجات، حدّثي الصفحة."});
})();
</script>
</body>
</html>
